<!DOCTYPE html>

<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام الإمام ورش</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #059669;
    --primary-dark: #047857;
    --primary-light: #d1fae5;
    --primary-lighter: #ecfdf5;
    --accent: #f59e0b;
    --accent-light: #fef3c7;
    --danger: #dc2626;
    --danger-light: #fee2e2;
    --info: #2563eb;
    --info-light: #dbeafe;
    --warning: #d97706;
    --bg: #f0fdf4;
    --bg-card: #ffffff;
    --bg-sidebar: #022c22;
    --text-primary: #064e3b;
    --text-secondary: #6b7280;
    --text-light: #9ca3af;
    --border: #d1fae5;
    --border-dark: #a7f3d0;
    --shadow-sm: 0 1px 3px rgba(5,150,105,0.08);
    --shadow: 0 4px 16px rgba(5,150,105,0.12);
    --shadow-lg: 0 8px 32px rgba(5,150,105,0.18);
    --radius: 14px;
    --radius-sm: 8px;
    --radius-lg: 20px;
    --font: 'Tajawal', sans-serif;
  }

- { margin: 0; padding: 0; box-sizing: border-box; }

body {
font-family: var(–font);
background: var(–bg);
color: var(–text-primary);
min-height: 100vh;
direction: rtl;
}

/* ===== LOGIN PAGE ===== */
#loginPage {
min-height: 100vh;
display: flex;
align-items: center;
justify-content: center;
background: linear-gradient(135deg, #022c22 0%, #064e3b 40%, #065f46 70%, #059669 100%);
position: relative;
overflow: hidden;
}

#loginPage::before {
content: ‘’;
position: absolute;
inset: 0;
background: url(“data:image/svg+xml,%3Csvg width=‘60’ height=‘60’ viewBox=‘0 0 60 60’ xmlns=‘http://www.w3.org/2000/svg’%3E%3Cg fill=‘none’ fill-rule=‘evenodd’%3E%3Cg fill=’%23ffffff’ fill-opacity=‘0.03’%3E%3Cpath d=‘M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z’/%3E%3C/g%3E%3C/g%3E%3C/svg%3E”);
}

.login-card {
background: white;
border-radius: var(–radius-lg);
padding: 48px 40px;
width: 100%;
max-width: 440px;
box-shadow: 0 24px 80px rgba(0,0,0,0.35);
position: relative;
z-index: 1;
animation: slideUp 0.5s ease;
}

@keyframes slideUp {
from { opacity: 0; transform: translateY(30px); }
to { opacity: 1; transform: translateY(0); }
}

.login-logo {
text-align: center;
margin-bottom: 32px;
}

.login-logo .icon {
width: 72px; height: 72px;
background: linear-gradient(135deg, var(–primary), var(–primary-dark));
border-radius: 50%;
display: inline-flex;
align-items: center;
justify-content: center;
margin-bottom: 16px;
box-shadow: 0 8px 24px rgba(5,150,105,0.35);
}

.login-logo .icon svg { width: 36px; height: 36px; fill: white; }

.login-logo h1 {
font-size: 1.6rem;
font-weight: 800;
color: var(–text-primary);
margin-bottom: 4px;
}

.login-logo p {
font-size: 0.85rem;
color: var(–text-secondary);
}

.form-group {
margin-bottom: 18px;
}

.form-group label {
display: block;
font-size: 0.85rem;
font-weight: 600;
color: var(–text-primary);
margin-bottom: 8px;
}

.form-group input, .form-group select, .form-group textarea {
width: 100%;
padding: 12px 16px;
border: 2px solid var(–border-dark);
border-radius: var(–radius-sm);
font-family: var(–font);
font-size: 0.95rem;
color: var(–text-primary);
background: var(–bg);
transition: all 0.2s;
outline: none;
}

.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
border-color: var(–primary);
background: white;
box-shadow: 0 0 0 4px rgba(5,150,105,0.1);
}

.btn {
display: inline-flex;
align-items: center;
gap: 8px;
padding: 12px 24px;
border-radius: var(–radius-sm);
font-family: var(–font);
font-size: 0.9rem;
font-weight: 700;
border: none;
cursor: pointer;
transition: all 0.2s;
text-decoration: none;
white-space: nowrap;
}

.btn-primary {
background: linear-gradient(135deg, var(–primary), var(–primary-dark));
color: white;
box-shadow: 0 4px 12px rgba(5,150,105,0.3);
}

.btn-primary:hover {
transform: translateY(-1px);
box-shadow: 0 6px 20px rgba(5,150,105,0.4);
}

.btn-primary:active { transform: translateY(0); }

.btn-secondary {
background: var(–primary-lighter);
color: var(–primary-dark);
border: 2px solid var(–border-dark);
}

.btn-secondary:hover { background: var(–primary-light); }

.btn-danger {
background: var(–danger-light);
color: var(–danger);
border: 2px solid #fca5a5;
}

.btn-danger:hover { background: #fecaca; }

.btn-warning {
background: var(–accent-light);
color: var(–warning);
border: 2px solid #fcd34d;
}

.btn-warning:hover { background: #fde68a; }

.btn-info {
background: var(–info-light);
color: var(–info);
border: 2px solid #93c5fd;
}

.btn-sm { padding: 7px 14px; font-size: 0.8rem; }
.btn-xs { padding: 4px 10px; font-size: 0.75rem; }
.btn-block { width: 100%; justify-content: center; }

.btn-login {
width: 100%;
justify-content: center;
padding: 14px;
font-size: 1rem;
margin-top: 8px;
border-radius: var(–radius-sm);
}

.error-msg {
background: var(–danger-light);
border: 1.5px solid #fca5a5;
color: var(–danger);
padding: 10px 14px;
border-radius: var(–radius-sm);
font-size: 0.85rem;
font-weight: 500;
margin-top: 12px;
display: none;
align-items: center;
gap: 8px;
}

.divider {
text-align: center;
color: var(–text-light);
font-size: 0.8rem;
margin: 20px 0;
position: relative;
}

.divider::before, .divider::after {
content: ‘’;
position: absolute;
top: 50%;
width: 40%;
height: 1px;
background: var(–border-dark);
}

.divider::before { right: 0; }
.divider::after { left: 0; }

/* ===== MAIN APP ===== */
#app { display: none; }

.layout {
display: flex;
min-height: 100vh;
}

/* SIDEBAR */
.sidebar {
width: 260px;
background: var(–bg-sidebar);
display: flex;
flex-direction: column;
position: fixed;
height: 100vh;
right: 0;
top: 0;
z-index: 100;
transition: transform 0.3s ease;
overflow-y: auto;
}

.sidebar-header {
padding: 24px 20px 20px;
border-bottom: 1px solid rgba(255,255,255,0.08);
}

.sidebar-logo {
display: flex;
align-items: center;
gap: 12px;
margin-bottom: 12px;
}

.sidebar-logo .icon {
width: 44px; height: 44px;
background: linear-gradient(135deg, var(–primary), #34d399);
border-radius: 12px;
display: flex;
align-items: center;
justify-content: center;
flex-shrink: 0;
}

.sidebar-logo .icon svg { width: 24px; height: 24px; fill: white; }

.sidebar-logo-text h2 {
font-size: 1rem;
font-weight: 800;
color: white;
}

.sidebar-logo-text p {
font-size: 0.7rem;
color: rgba(255,255,255,0.5);
}

.user-badge {
display: flex;
align-items: center;
gap: 8px;
background: rgba(255,255,255,0.06);
padding: 10px 12px;
border-radius: var(–radius-sm);
}

.user-badge .avatar {
width: 34px; height: 34px;
border-radius: 50%;
display: flex;
align-items: center;
justify-content: center;
font-size: 0.8rem;
font-weight: 700;
flex-shrink: 0;
}

.user-badge .info { flex: 1; min-width: 0; }

.user-badge .name {
font-size: 0.82rem;
font-weight: 700;
color: white;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
}

.user-badge .role {
font-size: 0.7rem;
color: rgba(255,255,255,0.5);
}

.sidebar-nav {
flex: 1;
padding: 12px 12px;
}

.nav-section {
margin-bottom: 8px;
}

.nav-section-label {
font-size: 0.65rem;
font-weight: 700;
color: rgba(255,255,255,0.3);
text-transform: uppercase;
letter-spacing: 0.1em;
padding: 0 10px;
margin-bottom: 4px;
margin-top: 12px;
}

.nav-item {
display: flex;
align-items: center;
gap: 10px;
padding: 10px 12px;
border-radius: var(–radius-sm);
cursor: pointer;
transition: all 0.15s;
color: rgba(255,255,255,0.6);
font-size: 0.88rem;
font-weight: 500;
margin-bottom: 2px;
}

.nav-item:hover {
background: rgba(255,255,255,0.07);
color: rgba(255,255,255,0.9);
}

.nav-item.active {
background: linear-gradient(135deg, rgba(5,150,105,0.35), rgba(5,150,105,0.15));
color: #34d399;
border: 1px solid rgba(52,211,153,0.2);
}

.nav-item svg {
width: 18px; height: 18px;
flex-shrink: 0;
opacity: 0.8;
}

.sidebar-footer {
padding: 16px 12px;
border-top: 1px solid rgba(255,255,255,0.08);
}

.btn-logout {
width: 100%;
display: flex;
align-items: center;
justify-content: center;
gap: 8px;
padding: 10px;
background: rgba(220,38,38,0.15);
border: 1px solid rgba(220,38,38,0.25);
border-radius: var(–radius-sm);
color: #f87171;
font-family: var(–font);
font-size: 0.85rem;
font-weight: 600;
cursor: pointer;
transition: all 0.2s;
}

.btn-logout:hover { background: rgba(220,38,38,0.25); }

/* MAIN CONTENT */
.main-content {
margin-right: 260px;
flex: 1;
display: flex;
flex-direction: column;
min-height: 100vh;
}

.topbar {
background: white;
padding: 0 28px;
height: 64px;
display: flex;
align-items: center;
justify-content: space-between;
border-bottom: 1px solid var(–border);
box-shadow: var(–shadow-sm);
position: sticky;
top: 0;
z-index: 50;
}

.topbar-title {
font-size: 1.15rem;
font-weight: 800;
color: var(–text-primary);
}

.topbar-actions {
display: flex;
align-items: center;
gap: 12px;
}

.hamburger {
display: none;
background: none;
border: none;
cursor: pointer;
padding: 8px;
color: var(–text-primary);
}

.page-content {
padding: 28px;
flex: 1;
}

/* ===== CARDS ===== */
.card {
background: var(–bg-card);
border-radius: var(–radius);
border: 1px solid var(–border);
box-shadow: var(–shadow-sm);
}

.card-header {
padding: 18px 22px;
border-bottom: 1px solid var(–border);
display: flex;
align-items: center;
justify-content: space-between;
gap: 12px;
flex-wrap: wrap;
}

.card-title {
font-size: 1rem;
font-weight: 800;
color: var(–text-primary);
display: flex;
align-items: center;
gap: 8px;
}

.card-title svg {
width: 20px; height: 20px;
color: var(–primary);
}

.card-body { padding: 22px; }

/* ===== STATS ===== */
.stats-grid {
display: grid;
grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
gap: 16px;
margin-bottom: 24px;
}

.stat-card {
background: white;
border-radius: var(–radius);
padding: 20px;
border: 1px solid var(–border);
box-shadow: var(–shadow-sm);
display: flex;
align-items: center;
gap: 16px;
transition: all 0.2s;
}

.stat-card:hover {
box-shadow: var(–shadow);
transform: translateY(-2px);
}

.stat-icon {
width: 52px; height: 52px;
border-radius: 14px;
display: flex;
align-items: center;
justify-content: center;
flex-shrink: 0;
}

.stat-icon svg { width: 26px; height: 26px; }

.stat-info { flex: 1; }

.stat-value {
font-size: 1.6rem;
font-weight: 900;
color: var(–text-primary);
line-height: 1;
margin-bottom: 4px;
}

.stat-label {
font-size: 0.8rem;
color: var(–text-secondary);
font-weight: 500;
}

/* ===== TABLE ===== */
.table-wrapper { overflow-x: auto; }

table {
width: 100%;
border-collapse: collapse;
font-size: 0.88rem;
}

thead th {
background: var(–primary-lighter);
padding: 12px 16px;
text-align: right;
font-size: 0.8rem;
font-weight: 700;
color: var(–primary-dark);
border-bottom: 2px solid var(–border-dark);
white-space: nowrap;
}

tbody tr {
border-bottom: 1px solid var(–border);
transition: background 0.15s;
}

tbody tr:hover { background: var(–primary-lighter); }

tbody td {
padding: 11px 16px;
color: var(–text-primary);
vertical-align: middle;
}

.empty-row td {
text-align: center;
color: var(–text-light);
padding: 40px;
font-size: 0.9rem;
}

/* ===== BADGES ===== */
.badge {
display: inline-flex;
align-items: center;
gap: 4px;
padding: 3px 10px;
border-radius: 20px;
font-size: 0.75rem;
font-weight: 700;
}

.badge-green { background: var(–primary-light); color: var(–primary-dark); }
.badge-red { background: var(–danger-light); color: var(–danger); }
.badge-yellow { background: var(–accent-light); color: var(–warning); }
.badge-blue { background: var(–info-light); color: var(–info); }
.badge-gray { background: #f3f4f6; color: #6b7280; }

/* ===== TABS ===== */
.tabs-wrapper {
display: flex;
gap: 6px;
flex-wrap: wrap;
margin-bottom: 20px;
padding-bottom: 12px;
border-bottom: 2px solid var(–border);
}

.tab-btn {
padding: 8px 18px;
border-radius: 20px;
border: 2px solid var(–border-dark);
background: white;
font-family: var(–font);
font-size: 0.85rem;
font-weight: 700;
color: var(–text-secondary);
cursor: pointer;
transition: all 0.2s;
}

.tab-btn:hover { border-color: var(–primary); color: var(–primary); }

.tab-btn.active {
background: var(–primary);
border-color: var(–primary);
color: white;
box-shadow: 0 4px 12px rgba(5,150,105,0.3);
}

/* ===== MODAL ===== */
.modal-overlay {
position: fixed;
inset: 0;
background: rgba(0,0,0,0.5);
backdrop-filter: blur(4px);
z-index: 1000;
display: flex;
align-items: center;
justify-content: center;
padding: 20px;
animation: fadeIn 0.2s ease;
}

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.modal {
background: white;
border-radius: var(–radius-lg);
width: 100%;
max-width: 520px;
max-height: 90vh;
overflow-y: auto;
animation: slideUp 0.3s ease;
box-shadow: 0 24px 60px rgba(0,0,0,0.3);
}

.modal-header {
padding: 20px 24px;
border-bottom: 1px solid var(–border);
display: flex;
align-items: center;
justify-content: space-between;
}

.modal-title {
font-size: 1.05rem;
font-weight: 800;
color: var(–text-primary);
}

.modal-close {
width: 32px; height: 32px;
border: none;
background: var(–bg);
border-radius: 50%;
cursor: pointer;
display: flex;
align-items: center;
justify-content: center;
font-size: 1.2rem;
color: var(–text-secondary);
transition: all 0.2s;
}

.modal-close:hover { background: var(–danger-light); color: var(–danger); }

.modal-body { padding: 24px; }
.modal-footer {
padding: 16px 24px;
border-top: 1px solid var(–border);
display: flex;
gap: 10px;
justify-content: flex-end;
}

/* ===== STUDENT VIEW ===== */
.student-hero {
background: linear-gradient(135deg, #022c22 0%, #065f46 60%, var(–primary) 100%);
border-radius: var(–radius-lg);
padding: 32px;
color: white;
margin-bottom: 24px;
position: relative;
overflow: hidden;
}

.student-hero::before {
content: ‘’;
position: absolute;
top: -50px; left: -50px;
width: 200px; height: 200px;
background: rgba(255,255,255,0.05);
border-radius: 50%;
}

.student-hero::after {
content: ‘’;
position: absolute;
bottom: -30px; right: -30px;
width: 150px; height: 150px;
background: rgba(255,255,255,0.05);
border-radius: 50%;
}

.student-hero h2 {
font-size: 1.5rem;
font-weight: 900;
margin-bottom: 8px;
position: relative;
z-index: 1;
}

.student-hero p {
opacity: 0.75;
font-size: 0.9rem;
position: relative;
z-index: 1;
}

.student-stats {
display: grid;
grid-template-columns: repeat(3, 1fr);
gap: 12px;
margin-top: 20px;
position: relative;
z-index: 1;
}

.student-stat {
background: rgba(255,255,255,0.12);
border-radius: var(–radius-sm);
padding: 14px;
text-align: center;
border: 1px solid rgba(255,255,255,0.15);
}

.student-stat .val {
font-size: 1.6rem;
font-weight: 900;
display: block;
}

.student-stat .lbl {
font-size: 0.7rem;
opacity: 0.7;
}

/* ===== WEEK GRID ===== */
.weeks-nav {
display: flex;
gap: 6px;
flex-wrap: wrap;
margin-bottom: 16px;
}

.week-btn {
padding: 6px 14px;
border-radius: 20px;
border: 1.5px solid var(–border-dark);
background: white;
font-family: var(–font);
font-size: 0.8rem;
font-weight: 600;
color: var(–text-secondary);
cursor: pointer;
transition: all 0.15s;
}

.week-btn:hover { border-color: var(–primary); color: var(–primary); }

.week-btn.active {
background: var(–primary);
border-color: var(–primary);
color: white;
}

/* ===== FORM GRID ===== */
.form-grid {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 14px;
}

.form-grid .full { grid-column: 1 / -1; }

/* ===== SCORE DISPLAY ===== */
.score-badge {
display: inline-flex;
align-items: center;
gap: 4px;
font-weight: 800;
font-size: 0.95rem;
}

.score-7 { color: #059669; }
.score-6 { color: #0d9488; }
.score-5 { color: #2563eb; }
.score-4 { color: #7c3aed; }
.score-3 { color: var(–warning); }
.score-2 { color: #ea580c; }
.score-1 { color: var(–danger); }

/* ===== ALERTS ===== */
.alert {
padding: 12px 16px;
border-radius: var(–radius-sm);
font-size: 0.88rem;
font-weight: 500;
display: flex;
align-items: center;
gap: 10px;
margin-bottom: 16px;
}

.alert-info { background: var(–info-light); color: var(–info); border: 1.5px solid #93c5fd; }
.alert-success { background: var(–primary-light); color: var(–primary-dark); border: 1.5px solid var(–border-dark); }
.alert-warning { background: var(–accent-light); color: var(–warning); border: 1.5px solid #fcd34d; }

/* ===== LOADING ===== */
.loading {
display: flex;
align-items: center;
justify-content: center;
padding: 40px;
color: var(–text-light);
gap: 10px;
font-size: 0.9rem;
}

.spinner {
width: 20px; height: 20px;
border: 3px solid var(–border-dark);
border-top-color: var(–primary);
border-radius: 50%;
animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* ===== DEVELOPER CREDITS ===== */
.dev-credits {
text-align: center;
padding: 16px;
font-size: 0.72rem;
color: rgba(255,255,255,0.25);
border-top: 1px solid rgba(255,255,255,0.06);
line-height: 1.8;
}

/* ===== SEARCH ===== */
.search-box {
position: relative;
max-width: 300px;
}

.search-box input {
padding-right: 40px;
background: var(–bg);
border: 2px solid var(–border-dark);
border-radius: 20px;
font-size: 0.85rem;
}

.search-box svg {
position: absolute;
right: 12px;
top: 50%;
transform: translateY(-50%);
width: 16px; height: 16px;
color: var(–text-light);
pointer-events: none;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
.sidebar {
transform: translateX(100%);
}

}

@media (max-width: 480px) {
.stats-grid { grid-template-columns: 1fr; }
.student-stats { grid-template-columns: 1fr; }
.login-card { padding: 32px 24px; }
.topbar { padding: 0 16px; }
}

/* ===== PAGE SECTIONS ===== */
.page-section { display: none; }
.page-section.active { display: block; }

/* ===== CONFIRM DIALOG ===== */
.confirm-overlay {
position: fixed;
inset: 0;
background: rgba(0,0,0,0.5);
backdrop-filter: blur(4px);
z-index: 2000;
display: flex;
align-items: center;
justify-content: center;
padding: 20px;
}

.confirm-box {
background: white;

async function doLogin() {
  const user = document.getElementById('loginUser').value.trim();
  const pass = document.getElementById('loginPass').value.trim();
  const errEl = document.getElementById('loginError');
  const errTxt = document.getElementById('loginErrorText');
  errEl.style.display = 'none';

  if (!user && !pass) {
    showLoginError('يرجى إدخال بيانات تسجيل الدخول');
    return;
  }

  // Check fixed accounts
  if (user === 'idarah' && pass === 'idarah2026') {
    startSession({ role: 'idarah', name: 'الإدارة', id: 'idarah' });
    return;
  }

  if (user === 'admin' && pass === 'admin2026') {
    startSession({ role: 'admin', name: 'المتابعة', id: 'admin' });
    return;
  }

  // Check teacher accounts
  try {
    const teachersSnap = await db.ref('teachers').once('value');
    const teachers = teachersSnap.val() || {};
    for (const [tid, t] of Object.entries(teachers)) {
      if (t.username === user && t.password === pass) {
        startSession({ role: 'teacher', name: t.name, id: tid, classes: t.classes || [] });
        return;
      }
    }

    // Check student by code
    const studentsSnap = await db.ref('students').once('value');
    const students = studentsSnap.val() || {};
    for (const [sid, s] of Object.entries(students)) {
      if (s.code === user || s.code === pass) {
        startSession({ role: 'student', name: s.name, id: sid, classId: s.classId, code: s.code });
        return;
      }
    }

    showLoginError('اسم المستخدم أو كلمة المرور غير صحيحة');
  } catch (e) {
    showLoginError('تعذر الاتصال بالخادم، تحقق من الاتصال');
  }
}

  document.getElementById('loginErrorText').textContent = msg;
  document.getElementById('loginError').style.display = 'flex';

  currentUser = user;
  currentRole = user.role;
  document.getElementById('loginPage').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  setupSidebar();
  loadData();
}

function getStudentAvg(sid) {
  let total = 0, count = 0;
  Object.values(allRecords).forEach(cls => {
    Object.values(cls).forEach(week => {
      Object.values(week).forEach(day => {
        const rec = day[sid];
        if (rec?.score) { total += parseInt(rec.score); count++; }
      });
    });
  });
  return count > 0 ? (total / count).toFixed(1) : 0;
}

function getWeekDays() {
  const base = new Date(2024, 8, 1);
  const start = new Date(base);
  start.setDate(start.getDate() + (selectedWeek - 1) * 7);
  while (start.getDay() !== 0) start.setDate(start.getDate() + 1);
  return Array.from({length:5}, (_, i) => {
    const d = new Date(start);
    d.setDate(d.getDate() + i);
    return `${d.getDate()}/${d.getMonth()+1}`;
  });
}

function getStudentStats(sid) {
  let total = 0, count = 0, max = 0, present = 0, total_days = 0;
  Object.values(allRecords).forEach(cls => {
    Object.values(cls).forEach(week => {
      Object.values(week).forEach(day => {
        const rec = day[sid];
        if (rec) {
          total_days++;
          if (rec.status !== 'absent') present++;
          if (rec.score) {
            const sc = parseInt(rec.score);
            total += sc; count++;
            if (sc > max) max = sc;
          }
        }
      });
    });
  });
  return {
    count,
    avg: count > 0 ? (total / count).toFixed(1) : 0,
    max,
    attendance: total_days > 0 ? Math.round((present / total_days) * 100) : 0
  };
}

function getLastRecord(sid) {
  let last = null;
  Object.entries(allRecords).forEach(([cid, cls]) => {
    Object.entries(cls).forEach(([wk, week]) => {
      const weekNum = parseInt(wk.replace('week',''));
      Object.entries(week).forEach(([dk, day]) => {
        const rec = day[sid];
        if (rec) {
          if (!last || weekNum > last.week) {
            last = { week: weekNum, day: DAYS[DAY_KEYS.indexOf(dk)]||dk, ...rec };
          }
        }
      });
    });
  });
  return last;
}

  const username = document.getElementById('tUser').value.trim();
  const password = document.getElementById('tPass').value.trim();
  const classes = [...document.querySelectorAll('#modalBody input[type=checkbox]:checked')].map(el=>el.value);

  if (!name || !username || !password) { alert('يرجى ملء جميع الحقول المطلوبة'); return; }

  const data = { name, username, password, classes };
  const ref = tid ? db.ref(`teachers/${tid}`) : db.ref('teachers').push();
  await ref.set(data);
  closeModal();
}

// CLASS MODAL
function openClassModal(cid) {
  const c = cid ? allClasses[cid] : null;
  showModal(`${cid?'تعديل':'إضافة'} فصل`, `
    <div class="form-group">
      <label>اسم الفصل *</label>
      <input type="text" id="cName" value="${c?.name||''}" placeholder="مثال: 3/1">
    </div>
  `, () => saveClass(cid));
}

async function saveClass(cid) {
  const name = document.getElementById('cName').value.trim();
  if (!name) { alert('يرجى إدخال اسم الفصل'); return; }
  const ref = cid ? db.ref(`classes/${cid}`) : db.ref('classes').push();
  await ref.set({ name });
  closeModal();
}

// STUDENT MODAL
function openStudentModal(sid) {
  const s = sid ? allStudents[sid] : null;
  const classOptions = Object.entries(allClasses).map(([cid,c]) =>
    `<option value="${cid}" ${s?.classId===cid?'selected':''}>${c.name}</option>`
  ).join('');

  showModal(`${sid?'تعديل':'إضافة'} طالب`, `
    <div class="form-grid">
      <div class="form-group full">
        <label>اسم الطالب *</label>
        <input type="text" id="sName" value="${s?.name||''}" placeholder="الاسم الكامل">
      </div>
      <div class="form-group">
        <label>رمز الطالب *</label>
        <input type="text" id="sCode" value="${s?.code||''}" placeholder="كود فريد للدخول">
      </div>
      <div class="form-group">
        <label>الفصل *</label>
        <select id="sClass">
          <option value="">اختر الفصل</option>
          ${classOptions}
        </select>
      </div>
    </div>
  `, () => saveStudent(sid));
}

async function saveStudent(sid) {
  const name = document.getElementById('sName').value.trim();
  const code = document.getElementById('sCode').value.trim();
  const classId = document.getElementById('sClass').value;
  if (!name || !code || !classId) { alert('يرجى ملء جميع الحقول المطلوبة'); return; }
  const ref = sid ? db.ref(`students/${sid}`) : db.ref('students').push();
  await ref.set({ name, code, classId });
  closeModal();
}

// RECORD MODAL
function openRecordModal(sid, dayKey) {
  const student = allStudents[sid];
  if (!student) return;
  const existing = allRecords[selectedClass]?.[`week${selectedWeek}`]?.[dayKey]?.[sid] || {};
  const dayName = DAYS[DAY_KEYS.indexOf(dayKey)];

  showModal(`رصد — ${student.name} | ${dayName} | أسبوع ${selectedWeek}`, `
    <div class="form-grid">
      <div class="form-group">
        <label>السورة / الحزب</label>
        <input type="text" id="rSurah" value="${existing.surah||''}" placeholder="اسم السورة">
      </div>
      <div class="form-group">
        <label>رقم الصفحة</label>
        <input type="number" id="rPage" value="${existing.page||''}" placeholder="رقم الصفحة" min="1" max="604">
      </div>
      <div class="form-group">
        <label>الدرجة (من 7)</label>
        <select id="rScore">
          <option value="">غير مرصود</option>
          ${[7,6,5,4,3,2,1].map(n=>`<option value="${n}" ${existing.score==n?'selected':''}>${n}/7</option>`).join('')}
        </select>
      </div>
      <div class="form-group">
        <label>الحالة</label>
        <select id="rStatus">
          ${STATUS_OPTIONS.map(s=>`<option value="${s.val}" ${existing.status===s.val?'selected':''}>${s.label}</option>`).join('')}
        </select>
      </div>
      <div class="form-group full">
        <label>ملاحظات المعلم</label>
        <textarea id="rNote" rows="3" placeholder="ملاحظة اختيارية...">${existing.note||''}</textarea>

```
  </div>
</div>
```

`, () => saveRecord(sid, dayKey));
}

async function saveRecord(sid, dayKey) {
const data = {
surah: document.getElementById(‘rSurah’).value.trim(),
page: document.getElementById(‘rPage’).value,
score: document.getElementById(‘rScore’).value,
status: document.getElementById(‘rStatus’).value,
note: document.getElementById(‘rNote’).value.trim(),
updatedAt: new Date().toISOString()
};
await db.ref(`records/${selectedClass}/week${selectedWeek}/${dayKey}/${sid}`).set(data);
closeModal();
}

// ===== MODAL HELPERS =====
function showModal(title, body, onSave) {
const overlay = document.createElement(‘div’);
overlay.className = ‘modal-overlay’;
overlay.id = ‘modalOverlay’;
overlay.innerHTML = `<div class="modal"> <div class="modal-header"> <div class="modal-title">${title}</div> <button class="modal-close" onclick="closeModal()">✕</button> </div> <div class="modal-body" id="modalBody">${body}</div> <div class="modal-footer"> <button class="btn btn-secondary" onclick="closeModal()">إلغاء</button> <button class="btn btn-primary" onclick="window._modalSave && window._modalSave()"> <svg viewBox="0 0 24 24" width="16" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> حفظ </button> </div> </div>`;
document.body.appendChild(overlay);
window._modalSave = onSave;
const firstInput = overlay.querySelector(‘input, select, textarea’);
if (firstInput) setTimeout(() => firstInput.focus(), 100);
}

function closeModal() {
const overlay = document.getElementById(‘modalOverlay’);
if (overlay) overlay.remove();
window._modalSave = null;
}

// ===== CONFIRM / DELETE =====
function confirmDelete(type, id, name) {
showConfirm(
`حذف ${name}`,
`هل أنت متأكد من حذف "${name}"؟ لا يمكن التراجع عن هذا الإجراء.`,
async () => {
const paths = { teacher: `teachers/${id}`, student: `students/${id}`, class: `classes/${id}` };
await db.ref(paths[type]).remove();
}
);
}

function confirmResetClass(cid) {
showConfirm(
‘تصفير بيانات الفصل’,
`هل تريد حذف جميع سجلات درجات فصل "${allClasses[cid]?.name}"؟ لا يمكن التراجع.`,
async () => { await db.ref(`records/${cid}`).remove(); }
);
}

function showConfirm(title, msg, onConfirm) {
const overlay = document.createElement(‘div’);
overlay.className = ‘confirm-overlay’;
overlay.id = ‘confirmOverlay’;
overlay.innerHTML = `<div class="confirm-box"> <div class="confirm-icon"> <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a1 1 0 011-1h4a1 1 0 011 1v2"/></svg> </div> <div class="confirm-title">${title}</div> <div class="confirm-msg">${msg}</div> <div class="confirm-actions"> <button class="btn btn-secondary" onclick="closeConfirm()">إلغاء</button> <button class="btn btn-danger" onclick="window._confirmAction && window._confirmAction(); closeConfirm();">تأكيد الحذف</button> </div> </div>`;
document.body.appendChild(overlay);
window._confirmAction = onConfirm;
}

function closeConfirm() {
const el = document.getElementById(‘confirmOverlay’);
if (el) el.remove();
window._confirmAction = null;
}

// ===== SIDEBAR TOGGLE =====
function toggleSidebar() {
const sb = document.getElementById(‘sidebar’);
const overlay = document.getElementById(‘sidebarOverlay’);
sb.classList.toggle(‘open’);
overlay.classList.toggle(‘show’);
}

function closeSidebar() {
document.getElementById(‘sidebar’).classList.remove(‘open’);
document.getElementById(‘sidebarOverlay’).classList.remove(‘show’);
}

// ===== LOGIN ENTER KEY =====
document.getElementById(‘loginPass’).addEventListener(‘keydown’, e => { if (e.key === ‘Enter’) doLogin(); });
document.getElementById(‘loginUser’).addEventListener(‘keydown’, e => { if (e.key === ‘Enter’) doLogin(); });
</script>
