<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة تبيان | المبرمج مصطفى عبدالله أحمد</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary: #1a5e63; /* أخضر ملكي */
            --secondary: #ffffff;
            --accent: #c5a059; /* ذهبي */
            --dark-bg: #121212;
            --dark-text: #00ff41; /* أخضر فسفوري للـ Dark Mode */
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            transition: all 0.5s ease;
        }

        /* أنميشن عصري */
        .fade-in { animation: fadeIn 0.8s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .app-container { max-width: 500px; margin: auto; background: white; min-height: 100vh; box-shadow: 0 0 20px rgba(0,0,0,0.1); position: relative; }

        header { background: var(--primary); color: white; padding: 40px 20px; text-align: center; border-radius: 0 0 30px 30px; }

        .login-card { padding: 25px; margin-top: -30px; background: white; border-radius: 20px; margin-inline: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }

        .tabs { display: flex; background: #f0f0f0; border-radius: 12px; padding: 5px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 12px; border: none; background: none; font-weight: bold; cursor: pointer; border-radius: 10px; transition: 0.3s; }
        .tab-btn.active { background: var(--primary); color: white; }

        input, select { width: 100%; padding: 14px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 12px; box-sizing: border-box; font-family: 'Tajawal'; font-size: 1rem; }

        .main-btn { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 12px; font-size: 1.1rem; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .main-btn:hover { transform: scale(1.02); background: #134549; }

        .panel { display: none; padding: 20px; }

        /* شاشة المعلم والإدارة */
        .info-box { background: #f9f9f9; padding: 15px; border-radius: 15px; border-right: 5px solid var(--accent); margin-bottom: 15px; }
        .footer-rights { position: absolute; bottom: 10px; width: 100%; text-align: center; font-size: 0.8rem; color: #999; }

        /* الألوان للتقادير */
        .status- حافظ { color: #27ae60; font-weight: bold; }
        .status-غائب { color: #e74c3c; font-weight: bold; }
    </style>
</head>
<body>

<div class="app-container fade-in">
    <header>
        <h1 style="margin:0;">تبيان</h1>
        <p style="margin:5px 0 0; opacity: 0.8;">إشراف المبرمج مصطفى عبدالله أحمد</p>
    </header>

    <div id="login-screen" class="login-card">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('admin')">الإدارة/المعلم</button>
            <button class="tab-btn" onclick="switchTab('student')">الطالب</button>
        </div>

        <div id="admin-inputs">
            <input type="text" id="user" placeholder="اسم المستخدم (Idarah)">
            <input type="password" id="pass" placeholder="كلمة المرور">
            <button class="main-btn" onclick="handleLogin('admin')">دخول النظام</button>
        </div>

        <div id="student-inputs" style="display:none;">
            <input type="number" id="s-code" placeholder="أدخل كود الطالب المكون من 6 أرقام">
            <button class="main-btn" onclick="handleLogin('student')">استعلام سريع</button>
        </div>
    </div>

    <div id="admin-panel" class="panel">
        <h3>لوحة التحكم الشاملة</h3>
        <div class="info-box">إضافة معلمين، فصول، وتقارير أداء المملكة</div>
        <input type="text" placeholder="اسم المعلم الجديد">
        <input type="text" placeholder="تعيين كلمة مرور للمعلم">
        <button class="main-btn" style="background:var(--accent)">إضافة معلم جديد</button>
        <hr>
        <h4>التقارير الأسبوعية للفصول</h4>
        <div id="reports" style="font-size: 0.9rem;">
            <p>✅ الفصول الممتازة: 12 فصل</p>
            <p>⚠️ فصول تحتاج متابعة: 2 فصل</p>
        </div>
        <button class="main-btn" style="margin-top:20px; background:#666" onclick="location.reload()">تسجيل خروج</button>
    </div>

    <div id="teacher-panel" class="panel">
        <h3>رصد الدرجات (أ. محمد)</h3>
        <select id="day-select"><option>الأحد</option><option>الاثنين</option><option>الثلاثاء</option></select>
        <select id="week-select"></select> <select id="grade-select">
            <option>حافظ</option>
            <option>حافظ جزئياً</option>
            <option>غير حافظ</option>
            <option>غائب</option>
        </select>
        <input type="number" placeholder="الدرجة من 10" id="score-input">
        <button class="main-btn" onclick="saveData()">تثبيت / تعديل الدرجة</button>
        <button class="main-btn" style="margin-top:20px; background:#666" onclick="location.reload()">تسجيل خروج</button>
    </div>

    <div class="footer-rights">تطوير المبرمج: مصطفى عبدالله أحمد © 2026</div>
</div>

<script>
    // إعدادات Firebase (ضع معلوماتك هنا)
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT.firebaseapp.com",
        databaseURL: "https://YOUR_PROJECT.firebaseio.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT.appspot.com",
        messagingSenderId: "YOUR_ID",
        appId: "YOUR_APP_ID"
    };
    
    // تفعيل Firebase (تأكد من وضع المعلومات أعلاه ليعمل الرصد الحقيقي)
    // firebase.initializeApp(firebaseConfig);
    // const database = firebase.database();

    // توليد 100 أسبوع لفظياً
    const weekSelect = document.getElementById('week-select');
    for(let i=1; i<=100; i++) {
        let opt = document.createElement('option');
        opt.text = "الأسبوع " + i;
        weekSelect.add(opt);
    }

    function switchTab(t) {
        document.getElementById('admin-inputs').style.display = t === 'admin' ? 'block' : 'none';
        document.getElementById('student-inputs').style.display = t === 'student' ? 'block' : 'none';
        document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', (t === 'admin' && i === 0) || (t === 'student' && i === 1)));
    }

    function handleLogin(role) {
        const u = document.getElementById('user').value;
        const p = document.getElementById('pass').value;

        if(role === 'admin') {
            if(u === 'Idarah' && p === 'idarah2026') {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('admin-panel').style.display = 'block';
            } else if (u === 'teacher' && p === '123') { // مثال لحساب معلم
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('teacher-panel').style.display = 'block';
            } else {
                alert('بيانات الدخول غير صحيحة');
            }
        } else {
            alert('تم الدخول بكود الطالب: ' + document.getElementById('s-code').value);
        }
    }

    function saveData() {
        alert('تم رصد الدرجة بنجاح. يمكنك تعديلها في أي وقت من هذه الشاشة.');
        // هنا يتم استدعاء database.ref().set() للربط مع فاير بيس
    }
</script>

</body>
</html>
