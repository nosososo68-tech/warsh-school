<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام الإمام ورش</title>

<!-- Font -->
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;700&display=swap" rel="stylesheet">

<style>
:root {
  --main: #059669;
  --bg: #f3f4f6;
  --card: #ffffff;
  --text: #111827;
}

* {
  font-family: 'Tajawal', sans-serif;
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
}

.container {
  max-width: 1100px;
  margin: auto;
  padding: 20px;
}

.card {
  background: var(--card);
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 15px;
}

input, select, button {
  padding: 10px;
  margin: 5px 0;
  width: 100%;
}

button {
  background: var(--main);
  color: #fff;
  border: none;
  cursor: pointer;
}

.tabs {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
}

.tab {
  padding: 8px 12px;
  background: #ddd;
  cursor: pointer;
  border-radius: 6px;
}

.active {
  background: var(--main);
  color: #fff;
}

.hidden {
  display: none;
}
</style>
</head>

<body>

<div class="container">

<h2>نظام الإمام ورش</h2>

<!-- Login -->
<div id="login" class="card">
  <h3>تسجيل الدخول</h3>
  <input id="username" placeholder="اسم المستخدم">
  <input id="password" type="password" placeholder="كلمة المرور / كود الطالب">
  <button onclick="login()">دخول</button>
  <p id="error" style="color:red"></p>
</div>

<!-- Main -->
<div id="app" class="hidden">

  <button onclick="logout()">تسجيل خروج</button>

  <!-- Tabs -->
  <div id="tabs" class="tabs"></div>

  <!-- Content -->
  <div id="content"></div>

</div>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js"></script>

<script>
// Firebase Config
const firebaseConfig = {
  apiKey: "AIzaSyAC9BzBpw66oBDriZoi9A5zsThKLFZiNv8",
  databaseURL: "https://imam-warsh-default-rtdb.asia-southeast1.firebasedatabase.app"
};

const app = firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// Globals
let currentUser = null;
let currentRole = null;
let currentClass = null;

// Login
function login() {
  let u = username.value;
  let p = password.value;

  if (u === "idarah" && p === "idarah2026") {
    currentRole = "idarah";
    init();
  }
  else if (u === "admin" && p === "admin2026") {
    currentRole = "admin";
    init();
  }
  else {
    // check teacher
    db.ref("teachers/" + u).once("value", snap => {
      if (snap.exists() && snap.val().password === p) {
        currentRole = "teacher";
        currentUser = u;
        init();
      } else {
        // student login by code
        db.ref("students/" + p).once("value", s => {
          if (s.exists()) {
            currentRole = "student";
            currentUser = p;
            init();
          } else {
            error.innerText = "بيانات غير صحيحة";
          }
        });
      }
    });
  }
}

function init() {
  login.classList.add("hidden");
  appDiv = document.getElementById("app");
  appDiv.classList.remove("hidden");

  loadClasses();
}

function logout() {
  location.reload();
}

// Load Classes
function loadClasses() {
  db.ref("classes").on("value", snap => {
    tabs.innerHTML = "";
    snap.forEach(c => {
      let div = document.createElement("div");
      div.className = "tab";
      div.innerText = c.key;
      div.onclick = () => selectClass(c.key);
      tabs.appendChild(div);
    });
  });
}

function selectClass(cls) {
  currentClass = cls;
  render();
}

// Render
function render() {
  content.innerHTML = "";

  if (currentRole === "student") {
    showStudent();
  }
  else if (currentRole === "teacher") {
    showTeacher();
  }
  else {
    showAdmin();
  }
}

// Admin View
function showAdmin() {
  let html = `
  <div class="card">
    <h3>إضافة طالب</h3>
    <input id="sname" placeholder="اسم الطالب">
    <input id="scode" placeholder="الكود">
    <input id="sclass" placeholder="الفصل">
    <button onclick="addStudent()">إضافة</button>
  </div>
  `;
  content.innerHTML = html;
}

// Add Student
function addStudent() {
  let s = {
    name: sname.value,
    class: sclass.value
  };
  db.ref("students/" + scode.value).set(s);
  alert("تمت الإضافة");
}

// Teacher View
function showTeacher() {
  db.ref("students").once("value", snap => {
    let html = `<div class="card"><h3>الطلاب</h3>`;
    snap.forEach(s => {
      if (s.val().class === currentClass) {
        html += `
        <div>
          ${s.val().name}
          <button onclick="record('${s.key}')">رصد</button>
        </div>`;
      }
    });
    html += "</div>";
    content.innerHTML = html;
  });
}

// Record
function record(id) {
  let surah = prompt("السورة");
  let page = prompt("الصفحة");
  let grade = prompt("الدرجة /7");

  db.ref("records/" + id).push({
    surah, page, grade, date: new Date().toLocaleDateString()
  });

  alert("تم الحفظ");
}

// Student View
function showStudent() {
  db.ref("records/" + currentUser).on("value", snap => {
    let html = `<div class="card"><h3>سجل إنجازاتي</h3>`;
    snap.forEach(r => {
      let d = r.val();
      html += `<div>${d.date} - ${d.surah} - ${d.grade}</div>`;
    });
    html += "</div>";
    content.innerHTML = html;
  });
}

</script>

</body>
</html>
