<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>WebFlow PRO | خدمات البرمجة</title>

    <script src="https://www.paypal.com/sdk/js?client-id=AefFtX4OIBRZdwmbksuAu5vSL39NbDJicfqvDL5CxI1mvBe6XPo44ajtWgY3ipiv7Ssztj6gQegHjzOq&currency=USD&components=buttons&enable-funding=card" defer></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAC9BzBpw66oBDriZoi9A5zsThKLFZiNv8",
            authDomain: "imam-warsh.firebaseapp.com",
            databaseURL: "https://imam-warsh-default-rtdb.asia-southeast1.firebasedatabase.app",
            storageBucket: "imam-warsh.appspot.com"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        // Expose to window for global access
        window._db = db;
        window._ref = ref;
        window._onValue = onValue;
        window._push = push;
        window._set = set;
        window._remove = remove;

        // Load Services
        onValue(ref(db, 'services'), snap => {
            const data = snap.val();
            window._services = data ? Object.entries(data).map(([id, v]) => ({ id, ...v })) : window._defaultServices;
            renderServices();
        });

        window._saveOrder = async (order) => {
            const r = push(ref(db, 'orders'));
            await set(r, order);
            return r.key;
        };
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">
    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #060c1a;
            --blue: #3b82f6;
            --cyan: #06b6d4;
            --text: #e2e8f0;
            --surface: rgba(255, 255, 255, 0.03);
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Tajawal', sans-serif;
            overflow-x: hidden;
        }
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.05); }
        .glow-text { text-shadow: 0 0 15px rgba(59, 130, 246, 0.5); }
        .btn-grad { background: linear-gradient(135deg, var(--blue), #8b5cf6); transition: 0.3s; }
        .btn-grad:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4); }
        
        /* Modals */
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
        .overlay.open { display: flex; }
        .modal { background: #0b1628; border: 1px solid rgba(59,130,246,0.2); border-radius: 24px; width: 100%; max-width: 500px; padding: 30px; position: relative; }
        
        /* Grid Background */
        .bg-grid { position: fixed; inset: 0; background-image: linear-gradient(rgba(59,130,246,0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(59,130,246,0.02) 1px, transparent 1px); background-size: 50px 50px; z-index: -1; }
    </style>
</head>
<body onload="AOS.init()">

    <div class="bg-grid"></div>

    <nav class="fixed top-0 w-full z-50 glass p-4 border-b border-white/5">
        <div class="container mx-auto flex justify-between items-center px-4">
            <div class="text-xl font-black glow-text text-blue-400">WebFlow <span class="text-white">PRO</span></div>
            <button onclick="openOverlay('adminLoginOverlay')" class="text-xs bg-white/5 px-4 py-2 rounded-lg hover:bg-white/10">⚙ الإدارة</button>
        </div>
    </nav>

    <section class="min-h-screen flex flex-col items-center justify-center text-center px-6 pt-20">
        <div class="bg-blue-500/10 text-blue-400 px-4 py-1 rounded-full text-xs mb-6 border border-blue-500/20" data-aos="fade-down">وكالة البرمجة رقم #1</div>
        <h1 class="text-5xl md:text-7xl font-black mb-6 leading-tight" data-aos="fade-up">نصنع <span class="text-blue-500">مواقعك</span><br>المستقبلية</h1>
        <p class="text-gray-400 max-w-xl mb-10" data-aos="fade-up" data-aos-delay="100">فريق متخصص في بناء تجارب رقمية استثنائية بأنيميشن سينمائي وأمان مطلق.</p>
        <div class="flex gap-4" data-aos="fade-up" data-aos-delay="200">
            <button onclick="document.getElementById('services').scrollIntoView({behavior:'smooth'})" class="btn-grad px-8 py-4 rounded-xl font-bold">استعرض الخدمات</button>
        </div>
    </section>

    <section id="services" class="container mx-auto px-6 py-24">
        <div class="text-center mb-16">
            <h2 class="text-3xl font-black mb-2">حلول برمجية <span class="text-blue-500">متكاملة</span></h2>
            <div class="h-1 w-20 bg-blue-500 mx-auto rounded-full"></div>
        </div>
        <div id="services-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            </div>
    </section>

    <div class="overlay" id="buyOverlay">
        <div class="modal">
            <button onclick="closeOverlay('buyOverlay')" class="absolute top-4 left-4 text-gray-500">✕</button>
            <h3 class="text-xl font-bold mb-2 text-center">إتمام الطلب</h3>
            <p id="mSvcName" class="text-blue-400 text-center font-bold mb-6"></p>
            
            <div class="space-y-4 mb-6">
                <div>
                    <label class="text-xs text-gray-500 block mb-1">رقم الواتساب</label>
                    <input id="waInput" type="tel" placeholder="9665xxxxxxxx" class="w-full bg-white/5 border border-white/10 p-3 rounded-xl outline-none focus:border-blue-500 text-right">
                </div>
                <div>
                    <label class="text-xs text-gray-500 block mb-1">وصف المشروع</label>
                    <textarea id="descInput" placeholder="ما هي ميزات موقعك المطلوبة؟" class="w-full bg-white/5 border border-white/10 p-3 rounded-xl outline-none focus:border-blue-500 text-right h-24"></textarea>
                </div>
            </div>

            <div id="paypal-btn-container"></div>
            <button onclick="showBankTransfer()" class="w-full mt-4 border border-white/10 py-3 rounded-xl text-sm hover:bg-white/5">🏛 تحويل بنكي</button>
        </div>
    </div>

    <div class="overlay" id="adminLoginOverlay">
        <div class="modal max-w-sm">
            <h3 class="text-center font-bold mb-4">دخول الإدارة</h3>
            <input id="adminPassInput" type="password" placeholder="رمز الدخول" class="w-full bg-white/5 border border-white/10 p-3 rounded-xl mb-4 text-center">
            <button onclick="checkAdmin()" class="w-full btn-grad py-3 rounded-xl font-bold">دخول</button>
        </div>
    </div>

    <script>
        const ADMIN_CODE = "65324677";
        window._defaultServices = [
            {id:'s1', icon:'🌐', title:'موقع تجاري', desc:'موقع تعريفي احترافي للشركات', price:1500},
            {id:'s2', icon:'🛒', title:'متجر إلكتروني', desc:'متجر متكامل مع سلة شراء', price:2500},
            {id:'s3', icon:'⚡', title:'صفحة هبوط', desc:'صفحة تسويقية سريعة جداً', price:800}
        ];

        function renderServices() {
            const grid = document.getElementById('services-grid');
            const svcs = window._services || window._defaultServices;
            grid.innerHTML = svcs.map(s => `
                <div class="glass p-8 rounded-3xl group" data-aos="fade-up">
                    <div class="text-4xl mb-4">${s.icon}</div>
                    <h3 class="text-xl font-bold mb-2">${s.title}</h3>
                    <p class="text-gray-400 text-sm mb-6">${s.desc}</p>
                    <div class="text-2xl font-black text-blue-400 mb-6">${s.price} <span class="text-xs text-white">ر.س</span></div>
                    <button onclick="openBuy('${s.id}')" class="w-full py-3 rounded-xl border border-blue-500/30 group-hover:bg-blue-500 transition-all font-bold">اطلب الآن</button>
                </div>
            `).join('');
        }

        function openBuy(id) {
            const svc = window._services.find(s => s.id === id);
            window._selectedSvc = svc;
            document.getElementById('mSvcName').innerText = svc.title;
            document.getElementById('paypal-btn-container').innerHTML = '';
            openOverlay('buyOverlay');
            initPaypal(svc);
        }

        function initPaypal(svc) {
            paypal.Buttons({
                style: { layout: 'vertical', color: 'blue', shape: 'rect' },
                createOrder: (data, actions) => {
                    const wa = document.getElementById('waInput').value;
                    if(!wa) { alert("يرجى إدخال رقم الواتساب أولاً"); return actions.reject(); }
                    return actions.order.create({
                        purchase_units: [{ amount: { value: (svc.price / 3.75).toFixed(2), currency_code: 'USD' } }]
                    });
                },
                onApprove: (data, actions) => actions.order.capture().then(details => {
                    const order = {
                        id: details.id,
                        svc: svc.title,
                        wa: document.getElementById('waInput').value,
                        desc: document.getElementById('descInput').value,
                        status: 'Paid'
                    };
                    window._saveOrder(order);
                    alert("تم الدفع بنجاح! سنتواصل معك قريباً.");
                    closeOverlay('buyOverlay');
                })
            }).render('#paypal-btn-container');
        }

        function checkAdmin() {
            if(document.getElementById('adminPassInput').value === ADMIN_CODE) {
                alert("أهلاً بك يا مدير! يمكنك الآن التحكم بالFirebase.");
                closeOverlay('adminLoginOverlay');
            } else {
                alert("الرمز خطأ!");
            }
        }

        function openOverlay(id) { document.getElementById(id).classList.add('open'); }
        function closeOverlay(id) { document.getElementById(id).classList.remove('open'); }
        
        // Initial Render
        renderServices();
    </script>
</body>
</html>
